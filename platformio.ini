;
; Build configuration for the SEN69C air-quality monitor.
; Requires pioarduino (community PlatformIO fork with Arduino-ESP32 3.x support).

[platformio]
default_envs = feather_s3_reversetft
; Optional, git-ignored local settings (see README). Missing file is fine.
extra_configs = platformio_override.ini

[env]
; pioarduino 55.03.311 = Arduino-ESP32 3.3.11 on ESP-IDF 5.5.5.
; 55.03.312 declares "PlatformIO Core >= 6.2.0", which rejects pioarduino's
; own core 6.2.0.post1 (parsed as a pre-release). Bump once that is fixed.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Packs the pages in web/ into the firmware (src/web/WebAssets.h).
extra_scripts = pre:scripts/embed_web.py

[env:feather_s3_reversetft]
board = adafruit_feather_esp32s3_reversetft
; 2 x 1.875 MB OTA app slots, 128 KB filesystem, 64 KB core dump
board_build.partitions = min_spiffs.csv
; The board definition also flashes Adafruit's TinyUF2 bootloader at 0x2D0000,
; which lies inside app1 with this partition table. Don't.
board_upload.arduino.flash_extra_images =
build_flags =
    -DFW_VERSION=\"1.1.0\"
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    sensirion/Sensirion I2C SEN69C@1.1.0
    sensirion/Sensirion Core@0.7.3
    lovyan03/LovyanGFX@1.2.33
